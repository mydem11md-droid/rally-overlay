name: Android Rally Overlay APK
on:
  push:
    branches:
      - feature/rally-overlay
    paths:
      - 'android-rally/**'
      - '.github/workflows/android-rally.yml'
  pull_request:
    paths:
      - 'android-rally/**'
      - '.github/workflows/android-rally.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and assemble debug APK
        id: build
        working-directory: android-rally
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          exit "$build_status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-rally-build-log
          path: android-rally/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mythic-rally-overlay-debug-apk
          path: android-rally/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release APK
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: rally-overlay-fix-${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$RELEASE_TAG" android-rally/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PR_HEAD_SHA" \
            --title "Rally Overlay fixes · PR #5" \
            --notes "Pre-release build for PR #5. Built by GitHub Actions from $PR_HEAD_SHA." \
            --prerelease
