name: Rally Overlay Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 3.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rally-overlay-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Select version and increment versionCode
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version. Use x.y.z"; exit 1; }
          else
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vX.Y.Z"; exit 1; }
          fi
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          OLD_CODE=$(git show "origin/$DEFAULT_BRANCH:android-rally/version.properties" | sed -n 's/^versionCode=//p')
          NEW_CODE=$((OLD_CODE + 1))
          printf 'versionCode=%s\nversionName=%s\n' "$NEW_CODE" "$VERSION" > android-rally/version.properties
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit version metadata
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          cp android-rally/version.properties /tmp/rally-version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release-version-update "origin/$DEFAULT_BRANCH"
          cp /tmp/rally-version.properties android-rally/version.properties
          git add android-rally/version.properties
          git commit -m "chore(release): version ${{ steps.version.outputs.version }}"
          git push origin HEAD:"$DEFAULT_BRANCH"
          BUMP_SHA=$(git rev-parse HEAD)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git tag "v${{ steps.version.outputs.version }}" "$BUMP_SHA"
            git push origin "v${{ steps.version.outputs.version }}"
            git checkout --detach "$BUMP_SHA"
          else
            git checkout --detach "$SOURCE_SHA"
            cp /tmp/rally-version.properties android-rally/version.properties
          fi

      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure all four Android signing secrets before publishing a release."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build signed release APK
        working-directory: android-rally
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p ../release-assets
          cp app/build/outputs/apk/release/app-release.apk ../release-assets/rally-overlay.apk

      - name: Generate release notes and version.json
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(git log -10 --pretty=format:'- %s' "${GITHUB_SHA}" 2>/dev/null || git log -10 --pretty=format:'- %s')
          [[ -n "$NOTES" ]] || NOTES="Maintenance and improvements."
          printf '%s\n' "$NOTES" > release-assets/release-notes.md
          jq -n --argjson versionCode "${{ steps.version.outputs.version_code }}" --arg versionName "${{ steps.version.outputs.version }}" --arg notes "$NOTES" '{versionCode:$versionCode,versionName:$versionName,apk:"rally-overlay.apk",notes:$notes}' > release-assets/version.json
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Rally Overlay v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            release-assets/rally-overlay.apk
            release-assets/version.json
