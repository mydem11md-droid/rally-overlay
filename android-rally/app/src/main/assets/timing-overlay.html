<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة توقيت التعزيز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1b2735;--mute:#6b7c8f;--line:#dde4ec;--acc:#1f5fff;--accink:#fff;--gbg:#e3f6ec;--g:#0b7a43;--bad:#c0392b;--warn:#a66b00;--orb1:#2f7bff;--orb2:#0a3fd1;--orbink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--card:#171e27;--ink:#e8edf3;--mute:#8696a8;--line:#2a3441;--acc:#6b95ff;--accink:#0b1220;--gbg:#10301f;--g:#5be3a0;--bad:#ff8c80;--warn:#f0c15a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1319;--card:#171e27;--ink:#e8edf3;--mute:#8696a8;--line:#2a3441;--acc:#6b95ff;--accink:#0b1220;--gbg:#10301f;--g:#5be3a0;--bad:#ff8c80;--warn:#f0c15a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Cairo,Tahoma,Arial,sans-serif;overflow:hidden}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);padding:20px;text-align:center}
#w{position:fixed;z-index:5;inset:0;width:100%;height:100%}
#c{width:68px;height:68px;border-radius:50%;border:3px solid #fff;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
background:radial-gradient(circle at 32% 28%,var(--orb1),var(--orb2));color:var(--orbink);box-shadow:0 5px 14px rgba(0,0,0,.35),0 0 0 3px rgba(47,123,255,.35);box-shadow:0 5px 14px rgba(0,0,0,.35),0 0 0 3px color-mix(in srgb,var(--orb1) 35%,transparent);
display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit}
#c:active{cursor:grabbing}
#c:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
#clk{font-size:12px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1}
#c small{font-size:8px;font-weight:600;opacity:.85;letter-spacing:.05em;line-height:1.2}
#p{position:absolute;width:min(300px,calc(100vw - 16px));max-height:min(78vh,540px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;direction:ltr;text-align:center;min-width:0}
[dir="rtl"] input.nm{direction:rtl;text-align:right}[dir="ltr"] input.nm{direction:ltr;text-align:left}
input[type=color]{width:30px;height:24px;padding:0;border-radius:6px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:.7rem;color:var(--mute)}
button{font:inherit;cursor:pointer}
button.b{font-weight:600;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);padding:5px 10px}
button.g{background:transparent;color:var(--acc)}
button.x{background:transparent;border:0;color:var(--mute);padding:0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hd b{font-size:.85rem}
.ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.ic[aria-expanded=true]{background:var(--bg)}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#set{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--ink)}
.md{display:flex;gap:4px;margin-top:4px}
.md button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:3px 0;font-size:.74rem}
.md button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.calibration{display:flex;align-items:center;gap:7px;margin:5px 0 2px}
.calibration button{width:34px;height:29px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:700;line-height:1}
.calibration button:active{border-color:var(--acc);color:var(--acc)}
.calibration strong{flex:1;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--acc)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:2px 9px;font-size:.76rem;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.tab.add{color:var(--acc);border-style:dashed;background:transparent}
.pn{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.pn input{font-weight:600}
.top{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 0;font-size:.78rem;font-weight:600}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.ban{background:var(--gbg);border:1px solid var(--g);border-radius:8px;padding:6px 10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.ban small{color:var(--g);font-weight:600;font-size:.74rem}
.ban b{color:var(--g);font-size:1.45rem;line-height:1.2;direction:ltr;font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:minmax(0,1fr) 46px 62px 38px 14px;gap:4px;align-items:center;margin-bottom:4px}
.r input{padding:3px 4px;font-size:12px}
.h{font-size:.66rem;color:var(--mute)}
.h span{text-align:center}
.at,.cd{direction:ltr;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.ok{color:var(--g)}.soon{color:var(--warn)}.late{color:var(--bad)}
.bar{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.st{color:var(--mute);font-size:.72rem}
html.ov{padding:0!important;background:transparent}
html.ov body{background:transparent;font-size:11px;line-height:1.35}
html.ov .note{display:none}
html.ov #w{position:absolute;inset:0;width:100%;height:100%}
html.ov #c{position:absolute;left:8px;top:8px;transform:none;cursor:default;box-shadow:0 2px 4px rgba(0,0,0,.4),0 0 0 3px rgba(47,123,255,.45);box-shadow:0 2px 4px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--orb1) 45%,transparent)}
html.ov #p{left:50%;top:84px;right:auto;bottom:auto;transform:translateX(-50%);width:calc(100% - 12px);max-width:260px;max-height:520px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
html.ov #p .hd{margin-bottom:5px}
html.ov #p .hd b{font-size:.82rem}
html.ov #p .ic{width:23px;height:23px}
html.ov #p #set{padding:6px;margin-bottom:6px}
html.ov #p .sw{gap:5px;margin:3px 0 6px}
html.ov #p .sw button{width:19px;height:19px}
html.ov #p .md{gap:3px;margin-top:3px}
html.ov #p .md button{padding:2px 0;font-size:.7rem}
html.ov #p .tabs{gap:3px;margin-bottom:5px}
html.ov #p .tab{padding:2px 7px;font-size:.7rem;max-width:82px}
html.ov #p .pn{gap:3px;margin-bottom:6px}
html.ov #p .top{gap:4px}
html.ov #p .chips{gap:3px;margin-top:5px}
html.ov #p .chip{padding:2px 0;font-size:.7rem}
html.ov #p .ban{padding:4px 7px;margin:6px 0}
html.ov #p .ban b{font-size:1.25rem}
html.ov #p .r{grid-template-columns:minmax(0,1fr) 40px 56px 32px 12px;gap:3px;margin-bottom:3px}
html.ov #p .r input{padding:2px 3px;font-size:10px}
html.ov #p .at,html.ov #p .cd{font-size:10px}
html.ov #p .bar{gap:4px;margin-top:5px}
html.ov #p button.b{padding:4px 8px;font-size:.72rem}
html.ov #p .st{font-size:.66rem}
</style>
</head>
<body>
<div class="note" data-i18n="note">اضغط الدائرة لفتح الأداة، واسحبها لتغيير مكانها</div>
<div id="w">
  <button id="c" aria-label="فتح أو إغلاق حاسبة التوقيت" aria-expanded="false"><span id="clk">--:--:--</span><small>UTC</small></button>
  <div id="p" hidden>
    <div class="hd"><b data-i18n="title">حاسبة التعزيز</b>
      <button class="x ic" id="gear" aria-label="الإعدادات" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
    <div id="set" hidden>
      <label data-i18n="color">لون الأداة</label>
      <div class="sw" id="sw"></div>
      <label data-i18n="appearance">المظهر</label>
      <div class="md" id="md"><button data-m="auto" data-i18n="auto">تلقائي</button><button data-m="light" data-i18n="light">فاتح</button><button data-m="dark" data-i18n="dark">داكن</button></div>
      <label data-i18n="calibration">معايرة التوقيت</label>
      <div class="calibration"><button id="calMinus" type="button" aria-label="تقليل التصحيح">−</button><strong id="calValue" aria-live="polite">+0.81 ثانية</strong><button id="calPlus" type="button" aria-label="زيادة التصحيح">+</button></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="pn"><input class="nm" id="pname" aria-label="اسم الحشد" placeholder="اسم الحشد"><button class="x ic" id="del" aria-label="حذف هذا الحشد" hidden>×</button></div>
    <div class="top">
      <div><label for="eta" data-i18n="eta">عدّاد يحشد (د:ث)</label><input id="eta"></div>
      <div><label for="em" data-i18n="enemyMarch">مسيرة الخصم (د:ث)</label><input id="em"></div>
      <button class="b" id="go" data-i18n="start">ابدأ</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="ban" id="ban" hidden><small data-i18n="allArrival">وصول الجميع UTC</small><b id="arr">--:--:--</b></div>
    <div class="r h" style="margin-top:8px"><span data-i18n="player">اللاعب</span><span data-i18n="march">مسيرة</span><span data-i18n="sendUtc">أرسل UTC</span><span data-i18n="after">بعد</span><span></span></div>
    <div id="pls"></div>
    <div class="bar"><button class="b g" id="add">+ لاعب</button><button class="b" id="cpb" data-i18n="copy">نسخ</button><button class="b g" id="cpa" data-i18n="copyAll" hidden>نسخ الكل</button><span class="st" id="cps"></span></div>
  </div>
</div>
<script>
var OV=!!window.RallyBridge||/[?&#]overlay/.test(location.href);
if(OV)document.documentElement.classList.add('ov');
function mk(n,em){return{n:n,defaultRallyName:true,eta:"4:00",em:em||"0:38",pl:[{n:tr("لاعب 1","Player 1"),defaultName:true,m:"0:45"},{n:tr("لاعب 2","Player 2"),defaultName:true,m:"1:30"}],ref:null}}
var pages=[mk(tr("حشد 1","Rally 1"))],cur=0;
try{var sv=JSON.parse(localStorage.getItem("rp4")||"null");
  if(sv&&Array.isArray(sv.pages)&&sv.pages.length){pages=sv.pages.map(function(x){x.ref=null;return x});cur=Math.min(sv.cur||0,pages.length-1)}}catch(e){}
function pg(){return pages[cur]}
function $(i){return document.getElementById(i)}
var appLanguage="en",toolLanguageMode="app",language="en";
try{appLanguage=window.RallyBridge?RallyBridge.getAppLanguage():(localStorage.getItem("rally-app-language")||"en")}catch(e){}
try{localStorage.removeItem("rp4-language-mode");if(window.RallyBridge)RallyBridge.setToolLanguage("app")}catch(e){}
function tr(ar,en){return language==="en"?en:ar}
var I18N={note:["اضغط الدائرة لفتح الأداة، واسحبها لتغيير مكانها","Tap the circle to open the tool, and drag it to move"],title:["حاسبة التعزيز","Reinforcement Calculator"],color:["لون الأداة","Tool color"],appearance:["المظهر","Appearance"],auto:["تلقائي","Auto"],light:["فاتح","Light"],dark:["داكن","Dark"],languageLabel:["لغة الأداة","Tool language"],eta:["عدّاد يحشد (د:ث)","Rally countdown (m:ss)"],enemyMarch:["مسيرة الخصم (د:ث)","Enemy march (m:ss)"],start:["ابدأ","Start"],allArrival:["وصول الجميع UTC","Everyone arrives UTC"],player:["اللاعب","Player"],march:["مسيرة","March"],sendUtc:["أرسل UTC","Send UTC"],after:["بعد","In"],copy:["نسخ","Copy"],copyAll:["نسخ الكل","Copy all"],calibration:["معايرة التوقيت","Time calibration"]};
function defaultName(name,kind,n,enabled){var s=String(name||""),m;if(enabled===false)return s;if(kind==="rally"&&(m=s.match(/^حشد\s+(\d+)$/)))return tr(s,"Rally "+m[1]);if(kind==="player"&&(m=s.match(/^لاعب\s+(\d+)$/)))return tr(s,"Player "+m[1]);if(kind==="rally"&&(m=s.match(/^Rally\s+(\d+)$/)))return tr("حشد "+m[1],s);if(kind==="player"&&(m=s.match(/^Player\s+(\d+)$/)))return tr("لاعب "+m[1],s);return s}
function setLanguage(code,persist){language=code==="ar"?"ar":"en";document.documentElement.lang=language;document.documentElement.dir=language==="ar"?"rtl":"ltr";document.body.dir=document.documentElement.dir;document.title=tr("حاسبة توقيت التعزيز","Reinforcement Timer");document.querySelectorAll("[data-i18n]").forEach(function(el){var v=I18N[el.dataset.i18n];if(v)el.textContent=tr(v[0],v[1])});$("c").setAttribute("aria-label",tr("فتح أو إغلاق حاسبة التوقيت","Open or close reinforcement calculator"));$("gear").setAttribute("aria-label",tr("الإعدادات","Settings"));$("calMinus").setAttribute("aria-label",tr("تقليل التصحيح","Decrease calibration"));$("calPlus").setAttribute("aria-label",tr("زيادة التصحيح","Increase calibration"));$("del").setAttribute("aria-label",tr("حذف هذا الحشد","Delete this rally"));$("pname").placeholder=tr("اسم الحشد","Rally name");$("pname").setAttribute("aria-label",tr("اسم الحشد","Rally name"));$("add").textContent=tr("+ لاعب","+ Player");var addRally=document.querySelector(".tab.add");if(addRally)addRally.setAttribute("aria-label",tr("إضافة حشد جديد","Add new rally"));document.querySelectorAll("#sw button[data-color-index]").forEach(function(b){var names=[["أزرق","Blue"],["بنفسجي","Purple"],["فيروزي","Turquoise"],["برتقالي","Orange"],["أحمر","Red"],["وردي","Pink"]],v=names[Number(b.dataset.colorIndex)];if(v)b.setAttribute("aria-label",tr(v[0],v[1]))});if(typeof ci!=="undefined"&&ci)ci.setAttribute("aria-label",tr("لون مخصص","Custom color"));pages.forEach(function(g,i){g.n=defaultName(g.n,"rally",i+1,g.defaultRallyName!==false);if(g.defaultRallyName===undefined)g.defaultRallyName=/^(حشد|Rally)\s+\d+$/.test(String(g.n||""));g.pl.forEach(function(p,j){p.n=defaultName(p.n,"player",j+1,p.defaultName!==false);if(p.defaultName===undefined)p.defaultName=/^(لاعب|Player)\s+\d+$/.test(String(p.n||""))})});if(persist){try{localStorage.removeItem("rp4-language-mode");if(window.RallyBridge)RallyBridge.setToolLanguage("app")}catch(e){}}render()}
function setAppLanguage(code){appLanguage=code==="ar"?"ar":"en";try{localStorage.setItem("rally-app-language",appLanguage)}catch(e){}toolLanguageMode="app";setLanguage(appLanguage,false)}
window.setAppLanguage=setAppLanguage;
function pad(x){return String(x).padStart(2,"0")}
function parseT(s){var d=String(s).replace(/\D/g,"");if(!d)return null;
  return d.length>2?parseInt(d.slice(0,-2),10)*60+parseInt(d.slice(-2),10):parseInt(d,10)}
function fmtT(t){return Math.floor(t/60)+":"+pad(t%60)}
function nowMs(){return Number(RallyBridge.getUtcTimeMillis())}
function clockMs(){return Number(RallyBridge.getUtcDisplayTimeMillis())}
function utc(ms){var d=new Date(ms);return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())+":"+pad(d.getUTCSeconds())}
function save(){try{localStorage.setItem("rp4",JSON.stringify({cur:cur,pages:pages.map(function(x){return{n:x.n,defaultRallyName:x.defaultRallyName,eta:x.eta,em:x.em,pl:x.pl.map(function(p){return{n:p.n,defaultName:p.defaultName,m:p.m}})}})}))}catch(e){}}
function bindTime(el,cb){
  el.setAttribute("inputmode","numeric");
  el.addEventListener("input",function(){var d=el.value.replace(/\D/g,"").slice(0,6);
    el.value=d.length>2?String(parseInt(d.slice(0,-2),10))+":"+d.slice(-2):d;if(cb)cb()});
  el.addEventListener("blur",function(){var t=parseT(el.value);if(t!==null){el.value=fmtT(t);if(cb)cb()}})}

function tabs(){
  var t=$("tabs");t.innerHTML="";
  pages.forEach(function(x,i){var b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=defaultName(x.n||"حشد "+(i+1),"rally",i+1,x.defaultRallyName!==false);
    b.onclick=function(){cur=i;save();render()};t.appendChild(b)});
  if(pages.length<8){var a=document.createElement("button");a.className="tab add";a.textContent=tr("+ حشد","+ Rally");a.setAttribute("aria-label","إضافة حشد جديد");
    a.onclick=function(){pages.push(mk(tr("حشد "+(pages.length+1),"Rally "+(pages.length+1)),pg().em));pages[pages.length-1].pl=[{n:tr("لاعب 1","Player 1"),defaultName:true,m:"0:45"}];cur=pages.length-1;save();render()};t.appendChild(a)}}
function render(){
  tabs();var g=pg();
  $("pname").value=defaultName(g.n,"rally",cur+1,g.defaultRallyName!==false);$("eta").value=g.eta;$("em").value=g.em;markChips();draw();
  $("ban").hidden=!g.ref;if(g.ref)$("arr").textContent=utc(g.ref);
  $("del").hidden=pages.length<2;$("cpa").hidden=pages.length<2;$("cps").textContent="";tick()}
function draw(){
  var box=$("pls");box.innerHTML="";
  pg().pl.forEach(function(p,i){
    var d=document.createElement("div");d.className="r";
    d.innerHTML='<input class="nm" aria-label="'+tr("اسم اللاعب","Player name")+'"><input aria-label="'+tr("مدة المسيرة","March duration")+'"><span class="at">--</span><span class="cd"></span><button class="x" aria-label="'+tr("حذف","Delete")+'">×</button>';
    var ins=d.querySelectorAll("input");ins[0].value=defaultName(p.n,"player",i+1,p.defaultName!==false);ins[1].value=p.m;
    ins[0].oninput=function(){p.n=ins[0].value;p.defaultName=false;save()};
    bindTime(ins[1],function(){p.m=ins[1].value;save();tick()});
    d.querySelector("button").onclick=function(){pg().pl.splice(i,1);save();draw();tick()};
    box.appendChild(d)})}
function atOf(g,p){var m=parseT(p.m);return m===null||!g.ref?null:g.ref-m*1000}
function tick(epochMillis){
  var now=typeof epochMillis==="number"&&isFinite(epochMillis)?epochMillis:clockMs();
  $("clk").textContent=utc(now);
  var g=pg();if(!g.ref||$("p").hidden)return;
  var rows=$("pls").children;
  g.pl.forEach(function(p,i){
    var at=atOf(g,p),r=rows[i];if(!r)return;
    var a=r.querySelector(".at"),c=r.querySelector(".cd");
    if(at===null){a.textContent="--";c.textContent="";return}
    a.textContent=utc(at);
    var left=(at-now)/1000;
    if(left<=0){c.textContent=left>-2?tr("الآن","Now"):tr("فات","Passed");c.className="cd late"}
    else{c.textContent=fmtT(Math.ceil(left));c.className="cd "+(left<=10?"soon":"ok")}})}

bindTime($("eta"),function(){pg().eta=$("eta").value;save();markChips()});
bindTime($("em"),function(){pg().em=$("em").value;save()});
$("pname").oninput=function(){pg().n=$("pname").value;pg().defaultRallyName=false;save();tabs()};
var PR=[1,3,4,5,10];
PR.forEach(function(m){var b=document.createElement("button");b.className="chip";b.textContent=m+(language==="en"?"m":"د");b.dataset.s=m*60;
  b.onclick=function(){$("eta").value=m+":00";pg().eta=m+":00";save();markChips()};$("chips").appendChild(b)});
function markChips(){var t=parseT($("eta").value);[].forEach.call($("chips").children,function(b){b.classList.toggle("on",Number(b.dataset.s)===t)})}

$("go").onclick=function(){
  var e=parseT($("eta").value),em=parseT($("em").value);
  if(e===null||!em){$("cps").textContent=tr("القيم غير صحيحة","Invalid values");return}
  pg().ref=nowMs()+(e+em)*1000;
  $("ban").hidden=false;$("arr").textContent=utc(pg().ref);$("cps").textContent="";tick()};
$("add").onclick=function(){var l=pg().pl;l.push({n:tr("لاعب "+(l.length+1),"Player "+(l.length+1)),defaultName:true,m:"1:00"});save();draw();tick()};
$("del").onclick=function(){pages.splice(cur,1);cur=Math.min(cur,pages.length-1);save();render()};
function textFor(g,now){
  var L=[(g.n||tr("حشد","Rally"))+" — "+tr("وقت وصول الجميع (UTC): ","Everyone arrives (UTC): ")+utc(g.ref)];
  g.pl.forEach(function(p){var at=atOf(g,p);
    L.push(p.n+" — "+(at===null?tr("مدة غير صحيحة","Invalid duration"):at<=now?tr("فات","Passed"):tr("أرسل في ","Send at ")+utc(at)))});
  return L.join("\n")}
function copy(t){
  function ok(){$("cps").textContent=tr("تم النسخ","Copied")}
  function fb(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{if(document.execCommand("copy"))ok();else throw new Error("copy failed")}catch(e){$("cps").textContent=tr("تعذّر النسخ","Could not copy")}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb()}
$("cpb").onclick=function(){
  if(!pg().ref){$("cps").textContent=tr("اضغط ابدأ أولاً","Press Start first");return}
  copy(textFor(pg(),nowMs()))};
$("cpa").onclick=function(){
  var now=nowMs(),L=pages.filter(function(g){return g.ref}).map(function(g){return textFor(g,now)});
  if(!L.length){$("cps").textContent=tr("اضغط ابدأ أولاً","Press Start first");return}
  copy(L.join("\n\n"))};

/* settings */
var S={acc:null,mode:OV?"dark":"auto"};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("rp3s")||"{}"))}catch(e){}
function mix(h,t,to){var n=parseInt(h.slice(1),16),c=[n>>16,n>>8&255,n&255].map(function(x){return Math.round(x+(to-x)*t).toString(16).padStart(2,"0")});return "#"+c.join("")}
function lum(h){var n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
function applyS(){
  var rs=document.documentElement.style,P=["--acc","--orb1","--orb2","--accink","--orbink"];
  if(S.acc){var dk=lum(S.acc)>.62?"#111":"#fff";
    rs.setProperty("--acc",S.acc);rs.setProperty("--orb1",mix(S.acc,.25,255));rs.setProperty("--orb2",mix(S.acc,.3,0));
    rs.setProperty("--accink",dk);rs.setProperty("--orbink",dk)}
  else P.forEach(function(k){rs.removeProperty(k)});
  if(S.mode==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.mode);
  [].forEach.call($("md").children,function(b){b.classList.toggle("on",b.dataset.m===S.mode)});
  [].forEach.call($("sw").querySelectorAll("button"),function(b){b.classList.toggle("on",(b.dataset.c||null)===S.acc)});
  try{localStorage.setItem("rp3s",JSON.stringify(S))}catch(e){}}
[["#1f5fff","أزرق"],["#7c3aed","بنفسجي"],["#0891b2","فيروزي"],["#f97316","برتقالي"],["#e11d48","أحمر"],["#db2777","وردي"]].forEach(function(c,i){
  var b=document.createElement("button");b.style.background=c[0];b.dataset.colorIndex=i;b.setAttribute("aria-label",c[1]);
  if(i)b.dataset.c=c[0];b.onclick=function(){S.acc=i?c[0]:null;applyS()};$("sw").appendChild(b)});
var ci=document.createElement("input");ci.type="color";ci.value=S.acc||"#1f5fff";ci.setAttribute("aria-label","لون مخصص");
ci.oninput=function(){S.acc=ci.value;applyS()};$("sw").appendChild(ci);
[].forEach.call($("md").children,function(b){b.onclick=function(){S.mode=b.dataset.m;applyS()}});
var calibrationOffsetMillis=Number(RallyBridge.getGameClockCalibrationMillis());
function renderCalibration(){var sign=calibrationOffsetMillis>=0?"+":"";$("calValue").textContent=sign+(calibrationOffsetMillis/1000).toFixed(2)+" "+tr("ثانية","s")}
function adjustCalibration(delta){calibrationOffsetMillis=Math.max(-10000,Math.min(10000,calibrationOffsetMillis+delta));renderCalibration();RallyBridge.setGameClockCalibrationMillis(calibrationOffsetMillis)}
$("calMinus").onclick=function(){adjustCalibration(-RallyBridge.getGameClockCalibrationStepMillis())};
$("calPlus").onclick=function(){adjustCalibration(RallyBridge.getGameClockCalibrationStepMillis())};
$("gear").onclick=function(){var o=$("set").hidden;$("set").hidden=!o;$("gear").setAttribute("aria-expanded",String(o));if(o){calibrationOffsetMillis=Number(RallyBridge.getGameClockCalibrationMillis());renderCalibration()}};

applyS();
renderCalibration();
setLanguage(toolLanguageMode==="app"?appLanguage:toolLanguageMode,false);

/* floating orb */
var w=$("w"),c=$("c"),p=$("p"),W=68,PAD=8,
    PANEL_W=Math.max(80,Math.min(260,screen.width-W-16)),
    WW=PANEL_W+12,
    MAX_PANEL_H=Math.max(40,Math.min(520,screen.height-100)),lastKey="";
if(OV){p.style.width="calc(100% - 12px)";p.style.maxWidth=PANEL_W+"px";p.style.maxHeight=MAX_PANEL_H+"px";p.style.overflowY="auto";}
function place(){
  if(OV){c.style.left=p.hidden?PAD+"px":"50%";c.style.top=PAD+"px";c.style.transform=p.hidden?"none":"translateX(-50%)";p.style.left="50%";p.style.right="auto";p.style.top=(W+16)+"px";p.style.bottom="auto";p.style.transform="translateX(-50%)";return}
  var r=w.getBoundingClientRect(),pw=Math.min(300,innerWidth-16);
  var l=Math.min(Math.max(8,r.left+W/2-pw/2),innerWidth-pw-8);
  p.style.left=(l-r.left)+"px";p.style.right="auto";
  if(r.top+W/2>innerHeight/2){p.style.bottom=(W+8)+"px";p.style.top="auto"}else{p.style.top=(W+8)+"px";p.style.bottom="auto"}}
function fit(){if(OV&&!p.hidden)p.style.maxHeight=MAX_PANEL_H+"px"}
function report(){
  var open=!p.hidden,cl=open?Math.round((WW-W)/2):PAD,ww=open?WW:W+2*PAD,
      hh=open?Math.round(Math.min(p.scrollHeight,MAX_PANEL_H)+PAD+W+8+PAD):W+2*PAD,key=[open,ww,hh,cl].join();
  if(key===lastKey)return;lastKey=key;
  w.style.left="0px";w.style.top="0px";place();
  try{window.RallyBridge.setLayout(open,ww,hh,cl)}catch(e){}}
function toggle(){
  var open=p.hidden;p.hidden=!open;c.setAttribute("aria-expanded",String(open));
  if(!open)p.style.maxHeight=OV?MAX_PANEL_H+"px":"";
  if(open){place();tick()}
  if(OV)report()}
if(OV){
  w.style.left=PAD+"px";w.style.top=PAD+"px";addEventListener("resize",fit);
  if(window.ResizeObserver)new ResizeObserver(function(){if(!p.hidden)report()}).observe(p)}
else{w.style.left=Math.max(4,(innerWidth-W)/2)+"px";w.style.top="calc(env(safe-area-inset-top,0px) + 10px)"}
var drag=null;
if(!OV){
  c.addEventListener("pointerdown",function(e){var r=w.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,l:r.left,t:r.top,moved:false};c.setPointerCapture(e.pointerId)});
  c.addEventListener("pointermove",function(e){
    if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;
    w.style.left=Math.min(Math.max(4,drag.l+dx),innerWidth-W-4)+"px";
    w.style.top=Math.min(Math.max(4,drag.t+dy),innerHeight-W-4)+"px";if(!p.hidden)place()});
  c.addEventListener("pointerup",function(){if(drag&&!drag.moved)toggle();drag=null});
  c.addEventListener("pointercancel",function(){drag=null})}
c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
window.setUtcTime=function(epochMillis){tick(Number(epochMillis))};
window.applyGameClockCalibrationDelta=function(deltaMillis){
  var delta=Number(deltaMillis)||0;
  pages.forEach(function(g){if(typeof g.ref==="number"&&isFinite(g.ref))g.ref+=delta});
  if(pg().ref)$("arr").textContent=utc(pg().ref);
  tick();
};
render();
if(OV)report();
</script>
